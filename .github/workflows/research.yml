name: ricerca-oro
# Un solo workflow (cancellare main.yml, che era un doppione).
# GitHub fa partire i "schedule" in ritardo anche di ore: la partenza puntuale arriva da un timer esterno
# (cron-job.org) che chiama workflow_dispatch ogni 15 minuti. Il cron qui sotto resta come riserva.
on:
  schedule:
    - cron: "7,37 * * * 0-5"
  workflow_dispatch: {}
  repository_dispatch:
    types: [aggiorna-macro]
permissions:
  contents: write
concurrency:
  group: ricerca-oro
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Servizio macro news pre-news comitato AI
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m xau_macro.service --once
      - name: Pubblica i file
        run: |
          git config user.name "ricerca-bot"
          git config user.email "ricerca-bot@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "aggiornamento $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
 
