name: ricerca-oro
on:
  schedule:
    - cron: "*/30 * * * 0-5"   # ogni 30 minuti, domenica-venerdi' (UTC)
  workflow_dispatch: {}          # avvio manuale dal tab Actions
permissions:
  contents: write
concurrency:
  group: ricerca-oro
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Servizio macro news pre-news comitato AI
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m xau_macro.service --once
      - name: Storico macro per i test (una volta al giorno o se manca)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ ! -s public/macro_history.csv ] || [ "$(date -u +%H)" = "05" ]; then
            python -m xau_macro.service --history || echo "storico non aggiornato"
          fi
      - name: Pubblica i file
        run: |
          git config user.name "ricerca-bot"
          git config user.email "ricerca-bot@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "aggiornamento $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push
